services:
  app:
    image: ${DOCKER_USERNAME}/tinyurl-backend:latest
    container_name: tinyurl-app
    command: ["npm", "run", "start"]
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    restart: always

  worker:
    image: ${DOCKER_USERNAME}/tinyurl-backend:latest
    container_name: tinyurl-worker
    command: ["npm", "run", "worker"]
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    restart: always

  redis:
    image: "redis:7-alpine"
    container_name: tinyurl-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:latest
    container_name: tinyurl-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /var/www/tinyurl-frontend:/var/www/tinyurl-frontend
    depends_on:
      - app

volumes:
  redis-data: