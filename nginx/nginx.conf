events {}

http {
    server {
        listen 80;

        # Serve frontend
        root /var/www/tinyurl-frontend;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        # Proxy backend API
        location /api/ {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}