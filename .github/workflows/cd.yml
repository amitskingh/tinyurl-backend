name: Deploy Backend to EC2
on:
  push:
    branches:
      - prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # Build Docker image
      # --no-cache ensures fresh build every time, no stale layers
      # npm ci, prisma generate, and tsc are all run inside Docker via Dockerfile
      - name: Build Image
        run: docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/tinyurl-backend:latest .

      # Push image to Docker Hub
      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/tinyurl-backend:latest

      # SSH into EC2 and redeploy
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/tinyurl-backend

            # Pull latest code (nginx config, docker-compose, etc.)
            git fetch origin
            git checkout prod
            sudo git reset --hard origin/prod

            # Stop running containers
            docker compose --env-file .env.prod -f docker-compose.prod.yml down

            # Remove stale local image so Docker is forced to pull fresh from Hub
            docker rmi $(docker images -q ${{ secrets.DOCKER_USERNAME }}/tinyurl-backend) 2>/dev/null || true

            # Pull fresh image from Docker Hub and start containers
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --pull always